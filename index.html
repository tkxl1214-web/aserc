<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111019" />
    <meta name="description" content="나만의 음악을 담아갈 공간, aserc." />
    <title>aserc — 나만의 음악 공간</title>
    <link rel="stylesheet" href="./styles.css" />
    <script async defer src="https://accounts.google.com/gsi/client"></script>
    <script>
      // This public client ID identifies aserc in Google Identity Services.
      // Never put a client secret in this file.
      window.ASERC_GOOGLE_CLIENT_ID = "569286111964-pc5cmev1oo6tu6ngmikkbbgaebiu46ad.apps.googleusercontent.com";
    </script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div class="ambient ambient-three" aria-hidden="true"></div>

    <div class="app-shell">
      <aside class="sidebar glass-panel" aria-label="주 메뉴">
        <a class="brand" href="#home" aria-label="aserc 홈" data-view="home">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>aserc</span>
        </a>

        <p class="sidebar-label">라이브러리</p>
        <nav class="side-nav" aria-label="페이지">
          <button class="nav-item is-active" data-view="home" type="button"><span class="nav-icon" data-icon="home"></span><span>홈</span><span class="nav-indicator"></span></button>
          <button class="nav-item" data-view="recommend" type="button"><span class="nav-icon" data-icon="sparkles"></span><span>추천</span><span class="nav-indicator"></span></button>
          <button class="nav-item" data-view="search" type="button"><span class="nav-icon" data-icon="search"></span><span>검색</span><span class="nav-indicator"></span></button>
          <button class="nav-item" data-view="playlists" type="button"><span class="nav-icon" data-icon="disc"></span><span>플레이리스트</span><span class="nav-count" id="playlistCount">0</span><span class="nav-indicator"></span></button>
          <button class="nav-item" data-view="ranking" type="button"><span class="nav-icon" data-icon="chart"></span><span>랭킹</span><span class="nav-indicator"></span></button>
        </nav>

        <div class="sidebar-note">
          <span class="note-orbit" aria-hidden="true">✳</span>
          <p>당신의 취향이<br />머물 자리를 만들어요.</p>
          <span class="note-caption">YOUR SPACE, YOUR SOUND</span>
        </div>

        <div class="account-area">
          <div class="google-mount" id="googleButton"></div>
          <button class="login-fallback" id="loginFallback" type="button">
            <span class="google-g" aria-hidden="true">G</span><span>Google로 로그인</span>
          </button>
          <div class="signed-in" id="signedIn" hidden>
            <img class="user-avatar" id="userAvatar" alt="" />
            <span class="user-name" id="userName"></span>
            <button class="signout-button" id="signOut" type="button" aria-label="로그아웃" title="로그아웃" data-icon="logout"></button>
          </div>
        </div>
      </aside>

      <main class="main-column">
        <header class="topbar">
          <div class="breadcrumb"><span class="breadcrumb-dot"></span><span id="breadcrumbLabel">나만의 음악 공간</span></div>
          <div class="topbar-actions">
            <span class="library-status"><span class="status-pulse"></span> 내 라이브러리</span>
            <button class="profile-mobile" id="mobileLogin" type="button" aria-label="Google 로그인"><span class="google-g">G</span></button>
          </div>
        </header>

        <div class="page-scroll" id="pageScroll">
          <section class="page-heading">
            <div>
              <p class="eyebrow" id="pageEyebrow">YOUR PERSONAL SOUNDSPACE</p>
              <h1 id="pageTitle">홈</h1>
            </div>
            <span class="heading-index" id="headingIndex">01 <i></i> 05</span>
          </section>
          <div class="view-content" id="viewContent" aria-live="polite"></div>
          <footer class="page-footer"><span>aserc</span><span>나만의 음악을 담아갈 공간</span><span>EST. 2026</span></footer>
        </div>
      </main>

      <aside class="player glass-panel" aria-label="음악 플레이어">
        <div class="player-track">
          <div class="player-art" aria-hidden="true"><span class="mini-vinyl"></span></div>
          <div class="player-copy"><strong>노래 없음</strong><span>음악을 추가하면 여기에 표시돼요</span></div>
          <span class="player-empty">—</span>
        </div>
        <div class="player-controls">
          <button class="control-button" type="button" disabled aria-label="이전 곡"><span data-icon="skip-back"></span></button>
          <button class="play-button" type="button" disabled aria-label="재생"><span data-icon="play"></span></button>
          <button class="control-button" type="button" disabled aria-label="다음 곡"><span data-icon="skip-forward"></span></button>
        </div>
        <div class="player-volume"><span class="volume-label">NOW PLAYING</span><div class="empty-progress"><i></i></div><span class="volume-icon" data-icon="volume"></span></div>
      </aside>

      <nav class="mobile-nav glass-panel" aria-label="모바일 페이지">
        <button class="mobile-nav-item is-active" data-view="home" type="button"><span data-icon="home"></span><small>홈</small></button>
        <button class="mobile-nav-item" data-view="recommend" type="button"><span data-icon="sparkles"></span><small>추천</small></button>
        <button class="mobile-nav-item" data-view="search" type="button"><span data-icon="search"></span><small>검색</small></button>
        <button class="mobile-nav-item" data-view="playlists" type="button"><span data-icon="disc"></span><small>플리</small></button>
        <button class="mobile-nav-item" data-view="ranking" type="button"><span data-icon="chart"></span><small>랭킹</small></button>
      </nav>
    </div>

    <div class="modal-layer" id="modalLayer" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
